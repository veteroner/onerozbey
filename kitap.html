<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kitabım — Öner Özbey</title>
    <meta name="description" content="Öner Özbey'in kitabı: Türkiye Hayvancılığı — Sorunlar, Çözümler ve Gelecek." />
    <meta name="theme-color" content="#8b1d20" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%238b1d20'/%3E%3Ctext x='50' y='64' font-size='52' font-family='Georgia, serif' fill='white' text-anchor='middle' font-weight='700'%3EÖ%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="index.html">
          <span class="brand-mark">ÖÖ</span>
          <span class="brand-name" data-bind="personal.fullName"></span>
        </a>
        <nav class="nav-links" data-bind="nav"></nav>
        <div class="nav-tools">
          <button class="icon-btn" id="print-btn" aria-label="Yazdır" title="Yazdır">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
          </button>
          <button class="icon-btn" id="theme-toggle" aria-label="Tema değiştir" title="Tema değiştir">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="section book-hero">
        <div class="container">
          <div class="book-hero-inner">
            <div class="book-cover-wrap">
              <div class="book-cover-3d" id="book-cover">
                <div class="book-spine"></div>
                <div class="book-front">
                  <div class="book-front-inner">
                    <p class="book-front-eyebrow">Öner Özbey</p>
                    <h2 class="book-front-title" data-bind="book.title"></h2>
                    <div class="book-front-icon">🐄</div>
                  </div>
                </div>
              </div>
            </div>
            <div class="book-info">
              <p class="eyebrow">Yayın</p>
              <h1 data-bind="book.title"></h1>
              <p class="book-author">Yazar: <strong data-bind="personal.fullName"></strong></p>
              <p class="prose-single" data-bind="book.desc"></p>
              <div class="book-actions">
                <a class="btn btn-primary" data-bind-attr="href:book.file" target="_blank">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                  Kitabı Oku
                </a>
                <a class="btn btn-ghost" data-bind-attr="href:book.file" download>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                  PDF İndir
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section section-muted">
        <div class="container">
          <h2 class="section-title">Kitabı Oku</h2>
          <p class="muted" style="margin-bottom:1.2rem">Aşağıdan tarayıcınızda doğrudan okuyabilir ya da PDF olarak indirebilirsiniz.</p>
          <div class="pdf-viewer-wrap">
            <iframe
              id="pdf-frame"
              class="pdf-viewer"
              data-src="assets/files/turkiye-hayvancilik-kitabi.pdf"
              title="Türkiye Hayvancılığı: Sorunlar, Çözümler ve Gelecek"
              allowfullscreen
            ></iframe>
            <div class="pdf-fallback" id="pdf-fallback" style="display:none">
              <p>Tarayıcınız gömülü PDF görüntüleyiciyi desteklemiyor.</p>
              <a class="btn btn-primary" data-bind-attr="href:book.file" download>PDF İndir</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div>
          <p class="brand-name" data-bind="personal.fullName"></p>
          <p class="muted" data-bind="personal.role"></p>
        </div>
        <div class="footer-links">
          <a data-bind-attr="href:mailto:personal.email" data-bind="personal.email"></a>
          <a data-bind-attr="href:tel:personal.phoneRaw" data-bind="personal.phone"></a>
        </div>
        <p class="muted small">© <span data-bind="site.year"></span> <span data-bind="personal.fullName"></span></p>
      </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const frame = document.getElementById('pdf-frame');
        const fallback = document.getElementById('pdf-fallback');
        const src = frame.getAttribute('data-src');
        frame.src = src;
        frame.addEventListener('error', () => {
          frame.style.display = 'none';
          fallback.style.display = 'block';
        });
      });
    </script>
  </body>
</html>
